</head>
<body>
<div class="wrap">
  <p style="margin:0 0 8px;"><a href="./" style="color:#60a5fa; font-size:0.85rem;">&larr; Back to menu</a></p>
  <h1>Test Editor</h1>
  <p class="sub">Change the questions, tasks, and wording in the tests. Saving needs the access token and changes the live tests for everyone.</p>

  <div id="msg"></div>

  <div id="login" class="card">
    <div class="warn">Paste the access token once. It is kept only in this browser on this device. Never share it, and do not paste it anywhere else.</div>
    <label for="tok">Access token</label>
    <input type="password" id="tok" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_...">
    <div class="row"><button type="button" onclick="signIn()">Sign in</button></div>
  </div>

  <div id="main" class="hidden">
    <div class="card">
      <label for="testSel">Which test?</label>
      <select id="testSel">
        <option value="phase1.html">Phase 1 Test</option>
        <option value="phase2.html">Phase 2 Test</option>
        <option value="ventilation.html">Ventilation Proficiency Test</option>
        <option value="autoextrication.html">Auto Extrication Proficiency Test</option>
      </select>
      <div class="row"><button type="button" onclick="loadTest()">Open this test</button><button type="button" class="alt" onclick="signOut()">Sign out</button></div>
    </div>
    <div id="tabs" class="tabs hidden"><button type="button" id="tab_tasks" onclick="setTab('tasks')">Tasks &amp; questions</button><button type="button" id="tab_page" onclick="setTab('page')">Page text</button><button type="button" id="tab_pdf" onclick="setTab('pdf')">PDF &amp; pop-ups</button></div>
    <div id="editor"></div>
  </div>
</div>

<div class="savebar hidden" id="savebar">
  <span class="count" id="count"></span>
  <button type="button" class="alt" onclick="discard()">Discard</button>
  <button type="button" id="saveBtn" onclick="save()">Save to live test</button>
</div>

<script>
var OWNER = 'widget13', REPO = 'Sunnyvale-Truck-Tests', BRANCH = 'main';
var API = 'https://api.github.com/repos/' + OWNER + '/' + REPO;
var TOKEN_KEY = 'TRUCK_TESTS_EDITOR_TOKEN';
var token = '', file = '', fileSha = '', fileText = '', data = null, original = null, names = {}, dirty = false;

function $(id) { return document.getElementById(id); }
function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function storeGet() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }

function gh(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, opts.headers || {});
  return fetch(API + path, opts).then(function(r) {
    return r.json().catch(function() { return {}; }).then(function(j) {
      if (!r.ok) { var e = new Error(j.message || ('GitHub error ' + r.status)); e.status = r.status; throw e; }
      return j;
    });
  });
}

function signIn() {
  var v = $('tok').value.trim();
  if (!v) { say('err', 'Paste the token first.'); return; }
  token = v;
  gh('').then(function(r) {
    if (!r.permissions || !r.permissions.push) throw new Error('This token can read the repository but cannot change it. Make sure Contents is set to Read and write.');
    storeSet(token); $('tok').value = '';
    showMain(); say('ok', 'Signed in.');

}
function signOut() { storeSet(''); token = ''; data = null; $('main').classList.add('hidden'); $('savebar').classList.add('hidden'); $('tabs').classList.add('hidden'); $('login').classList.remove('hidden'); $('editor').innerHTML = ''; say('ok', 'Signed out. The token was removed from this device.'); }

/* ---------- reading and writing the tasks block inside a test file ---------- */

}
function parseNames(text) {

}
function safeLit(v) { return JSON.stringify(v).replace(/<\//g, '<\\/').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029'); }

    out += '  ' + kk + ': [\n';
    out += obj[k].map(function(t) {
      var parts = [];
      Object.keys(t).forEach(function(p) { parts.push(p + ': ' + safeLit(t[p])); });

/* ---------- load / render ---------- */
var units = [], tab = 'tasks', filterQ = '';

/* ============ TEXT SCANNING (page text and PDF/pop-up text) ============ */

}
function plainHas(list, text) {

  var s = raw.replace(/\s+/g, ' ');

function displayToHtml(v) {
  var s = v.replace(/\r/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>').replace(/__([^_\n]+?)__/g, '<em>$1</em>');

function attrEsc(v) { return v.replace(/\r?\n/g, ' ').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function scanHtmlUnits(text, units, scripts) {
  var bm = /<body[^>]*>/i.exec(text); if (!bm) return;
  var root = parseHtml(text, bm.index + bm[0].length);
  var screen = null;

/* ---- JavaScript string scanner ---- */

function findRange(text, startMark, endMark) { var i = text.indexOf(startMark); if (i < 0) return null; var j = text.indexOf(endMark, i); return j < 0 ? null : { start: i, end: j + endMark.length }; }

    if (u.kind === 'attr') nr = attrEsc(u.value);
    else if (u.kind === 'title') nr = u.value.replace(/\r?\n/g, ' ').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    else { var lead = /^\s*/.exec(u.raw)[0], trail = /\s*$/.exec(u.raw)[0]; nr = lead + displayToHtml(u.value) + trail; if (!u.raw.replace(/\s/g, '')) nr = u.raw; }
    reps.push({ start: u.start, end: u.end, text: nr });
  });
  Object.keys(byLit).forEach(function(k) {
    var g = byLit[k], dec = g.u.dec;
    g.list.sort(function(a, b) { return b.s - a.s; }).forEach(function(u) { dec = dec.slice(0, u.s) + u.value.replace(/\r?\n/g, ' ') + dec.slice(u.e); });
    var base = g.u.start;
    var q = g.u.quote;
    reps.push({ start: base, end: g.u.end, text: q + jsEncode(dec, q) + q });
  });
  if (tasksObj) { var tb = findRange(text, START, END); if (tb) reps.push({ start: tb.start, end: tb.end - END.length, text: serialize(tasksObj) }); }
  reps.sort(function(a, b) { return b.start - a.start; });
  reps.forEach(function(r) { text = text.slice(0, r.start) + r.text + text.slice(r.end); });
  return text;
}


function loadTest() {
  if (dirty && !confirm('You have unsaved changes. Open another test and lose them?')) return;
  file = $('testSel').value; say('', '');
  $('editor').innerHTML = '<div class="card">Loading...</div>';
  gh('/contents/' + file + '?ref=' + BRANCH).then(function(r) {
    fileSha = r.sha; fileText = utf8Decode(r.content);
    data = parseBlock(fileText); names = parseNames(fileText);
    original = JSON.parse(JSON.stringify(data)); units = scanText(fileText); dirty = false;
    $('tabs').classList.remove('hidden'); filterQ = '';
    render();
  }).catch(function(e) { $('editor').innerHTML = ''; say('err', 'Could not open the test: ' + esc(e.message)); });
}
function setTab(t) { tab = t; filterQ = ''; render(); window.scrollTo(0, 0); }

function origIds() { var s = {}; Object.keys(original).forEach(function(k) { original[k].forEach(function(t) { s[t.id] = JSON.stringify(t); }); }); return s; }
function changedCount() {
  var o = origIds(), n = 0, now = {};
  Object.keys(data).forEach(function(k) { data[k].forEach(function(t) { now[t.id] = 1; if (o[t.id] !== JSON.stringify(t)) n++; }); });
  Object.keys(o).forEach(function(id) { if (!now[id]) n++; });
  units.forEach(function(u) { if (unitChanged(u)) n++; });
  return n;
}
function kindOf(t) { return t.isNoteOnly ? 'note' : (t.safety ? 'safety' : (t.isPassFail || t.max === 1 ? 'passfail' : 'scored')); }
function render() {
  ['tasks', 'page', 'pdf'].forEach(function(t) { var b = $('tab_' + t); if (b) b.classList.toggle('on', t === tab); });
  if (tab === 'tasks') renderTasks(); else renderText(tab);
  updateBar();
}
function renderTasks() {
  var o = origIds(), h = '';
  Object.keys(data).forEach(function(k) {
    h += '<div class="sec"><h2>' + esc(names[k] || k) + '</h2>';
    data[k].forEach(function(t, i) {
      var k2 = kindOf(t), isNew = !(t.id in o), ch = !isNew && o[t.id] !== JSON.stringify(t);
      var meta = (t.isNoteOnly ? 'Proctor note' : (t.isQ ? 'Question · ' : '') + (k2 === 'safety' ? 'Critical safety · ' : (k2 === 'passfail' ? 'Pass / fail · ' : '')) + t.max + ' pt' + (t.max === 1 ? '' : 's')) + (isNew ? ' · NEW' : (ch ? ' · CHANGED' : ''));
      h += '<div class="task' + (k2 === 'safety' ? ' safety' : '') + (isNew || ch ? ' changed' : '') + '" id="task_' + esc(t.id) + '">';
      h += '<div class="head" onclick="toggleTask(\'' + esc(t.id) + '\')"><div><div class="t">' + esc(t.title) + '</div><div class="meta">' + esc(meta) + '</div></div><div class="meta">Edit</div></div>';
      h += '<div class="body" id="body_' + esc(t.id) + '">' + form(k, i, t) + '</div></div>';
    });
    h += '<div class="row"><button type="button" class="alt small" onclick="addTask(\'' + esc(k) + '\')">+ Add a task or question</button></div></div>';
  });
  $('editor').innerHTML = h;
}
function inTab(u) { return tab === 'pdf' ? u.kind === 'js' : u.kind !== 'js'; }
function renderText(which) {
  var list = units.filter(inTab), h = '';
  h += '<div class="tip">' + (which === 'page' ? 'This is the wording on the test pages: briefings, scenarios, proctor instructions, headings, and buttons. Change the words only. Use **double stars** around words to make them bold, and a new line for a line break. The tabs at the top of the test use the section names, so rename those here too if you change a section name.' : 'This is wording that the PDF, the summary, and the pop-up messages put together. Keep each one to a single line, and do not use the &lt; or &gt; symbols. Section names are not listed here; ask for those to be changed.') + '</div>';
  h += '<input type="text" class="find" id="find" placeholder="Search the text..." value="' + esc(filterQ) + '" oninput="onFind(this.value)">';
  h += '<div id="tflist">' + textListHtml(list) + '</div>';
  $('editor').innerHTML = h;
}
function textListHtml(list) {
  var q = filterQ.toLowerCase().trim(), h = '', lastG = null, n = 0;
  list.forEach(function(u) {
    if (q && (u.value + ' ' + u.orig).toLowerCase().indexOf(q) < 0) return;
    var g = u.kind === 'js' ? 'PDF, summary, and pop-up wording' : (u.screen ? (u.screen.id === 'scr_admin' ? 'Admin screen' : (u.screen.id === 'scr_summary' ? 'Finish screen' : u.screen.label)) : 'Page title, header, and pop-ups');
    if (g !== lastG) { h += '<div class="grp">' + esc(g) + '</div>'; lastG = g; }
    h += '<div class="tf' + (unitChanged(u) ? ' changed' : '') + '" id="tf_' + u.id + '"><textarea id="tx_' + u.id + '" rows="' + Math.min(10, Math.max(2, Math.ceil(u.value.length / 42) + (u.value.split('\n').length - 1))) + '" oninput="onText(' + u.id + ')">' + esc(u.value) + '</textarea></div>';
    n++;
  });
  return n ? h : '<div class="tip">Nothing found.</div>';
}
function onFind(v) { filterQ = v; $('tflist').innerHTML = textListHtml(units.filter(inTab)); }
function onText(id) {
  var u = units[id], v = $('tx_' + id).value;
  u.value = v; dirty = true;
  var el = $('tf_' + id); if (el) el.classList.toggle('changed', unitChanged(u));
  updateBar();
}
function form(k, i, t) {
  var id = esc(t.id), kind = kindOf(t), h = '';
  h += '<label>Title</label><input type="text" id="f_title_' + id + '" value="' + esc(t.title) + '" oninput="edit(\'' + esc(k) + '\',' + i + ')">';
  h += '<label>Description or answer (plain text, or simple HTML such as &lt;br&gt; and &lt;strong&gt;)</label><textarea id="f_desc_' + id + '" oninput="edit(\'' + esc(k) + '\',' + i + ')">' + esc(t.desc) + '</textarea>';
  if (!t.isNoteOnly) {
    h += '<label>Type</label><select id="f_kind_' + id + '" onchange="edit(\'' + esc(k) + '\',' + i + ')">';
    [['scored', 'Scored 0 / 1 / 2 (or 0 to max)'], ['passfail', 'Pass / fail'], ['safety', 'Critical safety (fail = automatic fail)']].forEach(function(o) { h += '<option value="' + o[0] + '"' + (kind === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; });
    h += '</select>';
    h += '<label>Points</label><input type="number" min="1" max="20" id="f_max_' + id + '" value="' + t.max + '" oninput="edit(\'' + esc(k) + '\',' + i + ')">';
    h += '<label class="chk"><input type="checkbox" id="f_q_' + id + '"' + (t.isQ ? ' checked' : '') + ' onchange="edit(\'' + esc(k) + '\',' + i + ')"> Optional question (only counts if the proctor asks it)</label>';
  }
  h += '<div class="row"><button type="button" class="alt small" onclick="move(\'' + esc(k) + '\',' + i + ',-1)">Move up</button><button type="button" class="alt small" onclick="move(\'' + esc(k) + '\',' + i + ',1)">Move down</button><button type="button" class="danger small" onclick="del(\'' + esc(k) + '\',' + i + ')">Delete</button></div>';
  return h;
}
function toggleTask(id) { var el = $('task_' + id); if (el) el.classList.toggle('open'); }
function openIds() { var a = []; document.querySelectorAll('.task.open').forEach(function(e) { a.push(e.id.replace('task_', '')); }); return a; }
function rerender(keepOpen) { var open = keepOpen || openIds(), y = window.scrollY; render(); open.forEach(function(id) { var el = $('task_' + id); if (el) el.classList.add('open'); }); window.scrollTo(0, y); }

function edit(k, i) {
  var t = data[k][i], id = t.id;
  t.title = $('f_title_' + id).value; t.desc = $('f_desc_' + id).value;
  if ($('f_max_' + id)) {
    var kind = $('f_kind_' + id).value, mx = parseInt($('f_max_' + id).value, 10);
    t.max = mx > 0 ? mx : 1;
    delete t.safety; delete t.isPassFail;
    if (kind === 'safety') { t.safety = true; t.isPassFail = true; }
    else if (kind === 'passfail') { t.isPassFail = true; }
    if ($('f_q_' + id).checked) t.isQ = true; else delete t.isQ;
  }
  markDirty(id);
}
function markDirty(id) {
  dirty = true; updateBar();
  var o = origIds(), el = $('task_' + id);
  if (el) { var t = null; Object.keys(data).forEach(function(k) { data[k].forEach(function(x) { if (x.id === id) t = x; }); }); if (t) { el.classList.toggle('changed', o[id] !== JSON.stringify(t)); el.querySelector('.t').textContent = t.title; } }
}
function move(k, i, d) { var a = data[k], j = i + d; if (j < 0 || j >= a.length) return; var x = a[i]; a[i] = a[j]; a[j] = x; dirty = true; rerender([a[j].id]); }
function del(k, i) { if (!confirm('Delete "' + data[k][i].title + '"?')) return; data[k].splice(i, 1); dirty = true; rerender(); }
function newId(k) { var all = {}; Object.keys(data).forEach(function(s) { data[s].forEach(function(t) { all[t.id] = 1; }); }); var n = 1, id; do { id = k + '_n' + n++; } while (all[id]); return id; }
function addTask(k) {
  var t = { id: newId(k), title: 'New task', desc: 'Describe what the trainee must do.', max: 2 };
  data[k].push(t); dirty = true; rerender([t.id]);
  var el = $('task_' + t.id); if (el) el.scrollIntoView({ block: 'center' });
}
function updateBar() { var n = data ? changedCount() : 0; $('savebar').classList.toggle('hidden', !data); $('count').textContent = n ? n + ' change' + (n === 1 ? '' : 's') + ' not saved yet' : 'No changes'; $('saveBtn').disabled = !n; }
function discard() { if (!dirty || confirm('Throw away all unsaved changes?')) { data = JSON.parse(JSON.stringify(original)); units = scanText(fileText); dirty = false; render(); say('', ''); } }

function validate() {
  var ids = {}, probs = [];
  Object.keys(data).forEach(function(k) { data[k].forEach(function(t) {
    if (ids[t.id]) probs.push('Duplicate id ' + t.id); ids[t.id] = 1;
    if (!String(t.title).trim()) probs.push('A task has no title.');
    if (!t.isNoteOnly && !(t.max >= 1)) probs.push('"' + t.title + '" needs points of at least 1.');
  }); });
  units.forEach(function(u) {
    if (!unitChanged(u)) return;
    if (!u.value.trim()) probs.push('A text box was left empty (was: "' + u.orig.slice(0, 40) + '"). Put the old text back or write something.');
    if (u.kind === 'js' && /[<>]/.test(u.value)) probs.push('The PDF/pop-up text "' + u.value.slice(0, 40) + '..." cannot contain < or > symbols.');
  });
  return probs;
}
function scriptBodies(text) { var out = [], re = /<script(?![^>]*\ssrc=)[^>]*>([\s\S]*?)<\/script>/gi, m; while ((m = re.exec(text))) out.push(m[1]); return out; }
function elementCount(text) { return new DOMParser().parseFromString(text, 'text/html').getElementsByTagName('*').length; }
function selfCheck(oldText, newText) {
  if (elementCount(oldText) !== elementCount(newText)) throw new Error('page structure changed');
  scriptBodies(newText).forEach(function(b) { try { new Function(b); } catch (e) { throw new Error('page code would break: ' + e.message); } });
  if (!deepEq(parseBlock(newText), data)) throw new Error('task list mismatch');
}
function save() {
  var probs = validate(); if (probs.length) { say('err', esc(probs.join(' '))); return; }
  var n = changedCount(); if (!n) return;
  if (!confirm('Save ' + n + ' change' + (n === 1 ? '' : 's') + ' to the live test? Trainers will see it within a couple of minutes.')) return;
  var text;
  try {
    text = applyUnits(fileText, units, deepEq(data, original) ? null : data);
    selfCheck(fileText, text);
  } catch (e) { say('err', 'Safety check failed, nothing was saved (' + esc(e.message) + ').'); return; }
  $('saveBtn').disabled = true; $('saveBtn').textContent = 'Saving...';
  gh('/contents/' + file, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'Edit ' + file + ' via the test editor (' + n + ' change' + (n === 1 ? '' : 's') + ')', content: utf8Encode(text), sha: fileSha, branch: BRANCH }) })
  .then(function(r) {
    fileSha = r.content.sha; fileText = text; data = parseBlock(text); original = JSON.parse(JSON.stringify(data)); units = scanText(text); dirty = false;
    $('saveBtn').textContent = 'Save to live test'; render();
    say('ok', 'Saved. The live test updates in about 1 to 2 minutes. If a change does not show, close the page and reopen it. You can undo any save in the repo history on GitHub.');
  }).catch(function(e) {
    $('saveBtn').textContent = 'Save to live test'; updateBar();
    if (e.status === 409 || e.status === 422) say('err', 'The test changed on GitHub since you opened it, so nothing was saved. Tap Open this test to reload it, then redo your edits.');
    else if (e.status === 401 || e.status === 403) say('err', 'GitHub refused the save. The token may have expired or may not have Contents: Read and write. ' + esc(e.message));
    else say('err', 'Save failed: ' + esc(e.message));
  });
}

window.addEventListener('beforeunload', function(e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
(function init() { var t = storeGet(); if (t) { token = t; showMain(); gh('').catch(function(e) { if (e.status === 401) { storeSet(''); token = ''; $('main').classList.add('hidden'); $('login').classList.remove('hidden'); say('err', 'The saved token no longer works. Paste a new one.'); } }); } })();
</script>
